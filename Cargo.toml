[package]
name = "rust_pgn_reader_python_binding"
version = "4.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rust_pgn_reader_python_binding"
crate-type = ["lib", "cdylib"]
# lib is needed for the native benchmark

[dependencies]
pyo3 = { version = "0.29", features = ["multiple-pymethods"] }
shakmaty = "0.30"
memchr = "2.7"
rayon = "1.11"
num_cpus = "1.17"
arrow-array = "59"
pyo3-arrow = "0.19"
numpy = "0.29"

[features]
# Embeds PyO3 introspection metadata so `maturin generate-stubs` can emit
# .pyi files. Off by default to keep release wheels free of the metadata.
stubgen = ["pyo3/experimental-inspect"]

[dev-dependencies]
criterion = "0.8"
# reading the parquet corpus (benches/parquet_bench.rs)
arrow = "59"
parquet = "59"

[[bench]]
harness = false
name = "parquet_bench"

[profile.bench]
debug = true

# Usage: maturin develop --profile profiling
[profile.profiling]
inherits = "release"
debug = true
